[workspace]
resolver = "3"
members = ["wgpu-in-app", "app-surface", "cargo-so"]
default-members = ["wgpu-in-app"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
app-surface = { path = "./app-surface", default-features = false }
bytemuck = { version = "1.22", features = ["derive", "min_const_generics"] }
glam = "0.32"
log = "0.4"
noise = { version = "0.9", default-features = false }
futures-lite = "2"
rand = "0.8"
# wgpu = "30"
# wgpu = { path = "../forks/wgpu/wgpu" }
wgpu = { git = "https://github.com/jinleili/wgpu", branch = "fix-metal-srgb-10013" }
winit = { version = "0.30" }
raw-window-handle = "0.6"
env_logger = "0.11"

# macOS, iOS
libc = { version = "0.2", default-features = false }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

# android target
android_logger = "0.15"
jni = "0.21"
jni_fn = "0.1"
ndk-sys = "0.6"

# wasm target
js-sys = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", default-features = false }
